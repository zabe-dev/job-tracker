services:
  jobtracker:
    build: .
    ports:
      - "8000:8000"
    environment:
      JOBTRACKER_HOST: 0.0.0.0
      JOBTRACKER_PORT: 8000
      JOBTRACKER_DB_PATH: /data/jobtracker.db
      JOBTRACKER_AUTH_REQUIRED: ${JOBTRACKER_AUTH_REQUIRED:-true}
      JOBTRACKER_AUTH_USER: ${JOBTRACKER_AUTH_USER:?Set JOBTRACKER_AUTH_USER in .env}
      JOBTRACKER_AUTH_PASSWORD: ${JOBTRACKER_AUTH_PASSWORD:?Set JOBTRACKER_AUTH_PASSWORD in .env}
      CODEX_LB_URL: https://codex-lb.zabe.dev/backend-api/codex
      CODEX_LB_INTERNAL_URL: http://codex-lb:2455/backend-api/codex
      CODEX_HOME: /data/codex
    volumes:
      - jobtracker-data:/data
    restart: unless-stopped

volumes:
  jobtracker-data:
